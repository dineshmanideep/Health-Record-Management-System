  <rect x="208" y="200" width="160" height="30" rx="6" fill="#f59e0b" opacity="0.9"/>
  <text x="288" y="220" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Doctor  /doctor/*</text>

  <rect x="208" y="244" width="160" height="220" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="288" y="264" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold">Pages</text>
  <text x="288" y="280" text-anchor="middle" fill="#e2e8f0" font-size="9">Dashboard</text>
  <text x="288" y="295" text-anchor="middle" fill="#e2e8f0" font-size="9">Profile</text>
  <text x="288" y="310" text-anchor="middle" fill="#e2e8f0" font-size="9">Patients</text>
  <text x="288" y="325" text-anchor="middle" fill="#e2e8f0" font-size="9">Patient Records</text>
  <text x="288" y="340" text-anchor="middle" fill="#e2e8f0" font-size="9">Assign Records</text>
  <text x="288" y="355" text-anchor="middle" fill="#e2e8f0" font-size="9">Audit Logs</text>
  <line x1="228" y1="368" x2="348" y2="368" stroke="#334155" stroke-width="0.8"/>
  <text x="288" y="384" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="bold">API Calls</text>
  <text x="288" y="399" text-anchor="middle" fill="#64748b" font-size="9">GET /api/doctor/patients</text>
  <text x="288" y="412" text-anchor="middle" fill="#64748b" font-size="9">POST /api/doctor/record</text>
  <text x="288" y="427" text-anchor="middle" fill="#64748b" font-size="9">PUT /api/doctor/record/:id</text>
  <text x="288" y="442" text-anchor="middle" fill="#64748b" font-size="9">GET /api/doctor/audit-logs</text>

  <!-- ══ NURSE module ═════════════════════════════════════ -->
  <rect x="386" y="200" width="130" height="30" rx="6" fill="#10b981" opacity="0.9"/>
  <text x="451" y="220" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Nurse  /nurse/*</text>

  <rect x="386" y="244" width="130" height="220" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.3"/>
  <text x="451" y="264" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold">Pages</text>
  <text x="451" y="280" text-anchor="middle" fill="#e2e8f0" font-size="9">Dashboard</text>
  <text x="451" y="295" text-anchor="middle" fill="#e2e8f0" font-size="9">Profile</text>
  <text x="451" y="310" text-anchor="middle" fill="#e2e8f0" font-size="9">Assignments</text>
  <text x="451" y="325" text-anchor="middle" fill="#e2e8f0" font-size="9">Test Assgn.</text>
  <text x="451" y="340" text-anchor="middle" fill="#e2e8f0" font-size="9">Audit Logs</text>
  <line x1="400" y1="355" x2="502" y2="355" stroke="#334155" stroke-width="0.8"/>
  <text x="451" y="372" text-anchor="middle" fill="#10b981" font-size="9" font-weight="bold">Special</text>
  <text x="451" y="387" text-anchor="middle" fill="#64748b" font-size="9">Vitals update</text>
  <text x="451" y="402" text-anchor="middle" fill="#64748b" font-size="9">Custom fields</text>
  <text x="451" y="417" text-anchor="middle" fill="#64748b" font-size="9">Result upload</text>

  <!-- ══ HOSPITAL module ══════════════════════════════════ -->
  <rect x="534" y="200" width="160" height="30" rx="6" fill="#ef4444" opacity="0.9"/>
  <text x="614" y="220" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Hospital  /hospital/*</text>

  <rect x="534" y="244" width="160" height="220" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.3"/>
  <text x="614" y="264" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold">Pages</text>
  <text x="614" y="280" text-anchor="middle" fill="#e2e8f0" font-size="9">Dashboard</text>
  <text x="614" y="295" text-anchor="middle" fill="#e2e8f0" font-size="9">Profile</text>
  <text x="614" y="310" text-anchor="middle" fill="#e2e8f0" font-size="9">Doctors</text>
  <text x="614" y="325" text-anchor="middle" fill="#e2e8f0" font-size="9">Nurses</text>
  <text x="614" y="340" text-anchor="middle" fill="#e2e8f0" font-size="9">Tests · Test Assgn.</text>
  <text x="614" y="355" text-anchor="middle" fill="#e2e8f0" font-size="9">Audit Logs</text>
  <line x1="554" y1="368" x2="674" y2="368" stroke="#334155" stroke-width="0.8"/>
  <text x="614" y="384" text-anchor="middle" fill="#ef4444" font-size="9" font-weight="bold">API Calls</text>
  <text x="614" y="399" text-anchor="middle" fill="#64748b" font-size="9">GET /api/hospital/doctors</text>
  <text x="614" y="412" text-anchor="middle" fill="#64748b" font-size="9">POST /api/hospital/tests</text>
  <text x="614" y="427" text-anchor="middle" fill="#64748b" font-size="9">GET /api/hospital/audit-logs</text>
  <text x="614" y="442" text-anchor="middle" fill="#64748b" font-size="9">GET /api/hospital/test-assgn</text>

  <!-- ══ ADMIN module ═════════════════════════════════════ -->
  <rect x="712" y="200" width="160" height="30" rx="6" fill="#a78bfa" opacity="0.9"/>
  <text x="792" y="220" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Admin  /admin/*</text>

  <rect x="712" y="244" width="160" height="220" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="792" y="264" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold">Pages</text>
  <text x="792" y="280" text-anchor="middle" fill="#e2e8f0" font-size="9">Dashboard</text>
  <text x="792" y="295" text-anchor="middle" fill="#e2e8f0" font-size="9">Profile</text>
  <text x="792" y="310" text-anchor="middle" fill="#e2e8f0" font-size="9">Hospitals</text>
  <text x="792" y="325" text-anchor="middle" fill="#e2e8f0" font-size="9">Doctors</text>
  <text x="792" y="340" text-anchor="middle" fill="#e2e8f0" font-size="9">Nurses</text>
  <line x1="732" y1="355" x2="852" y2="355" stroke="#334155" stroke-width="0.8"/>
  <text x="792" y="372" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="bold">Special</text>
  <text x="792" y="387" text-anchor="middle" fill="#64748b" font-size="9">Approve hospitals</text>
  <text x="792" y="402" text-anchor="middle" fill="#64748b" font-size="9">User management</text>
  <text x="792" y="417" text-anchor="middle" fill="#64748b" font-size="9">System analytics</text>

  <!-- ══ GLOBAL COMPONENTS strip ══════════════════════════ -->
  <rect x="30" y="476" width="842" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="490" text-anchor="middle" fill="#64748b" font-size="10" font-weight="bold">Global Components (all authenticated pages)</text>
  <text x="450" y="505" text-anchor="middle" fill="#475569" font-size="9">FloatingNav · AccessibilityTools · ContextVoiceHelpButton · Toaster (react-hot-toast) · ThemeProvider</text>
</svg>
