<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, sans-serif">
  <rect width="900" height="520" fill="#0f172a"/>

  <text x="450" y="34" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">HRMS Frontend Module Structure &amp; Navigation Flow</text>

  <!-- Arrow defs -->
  <defs>
    <marker id="na" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="nb" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>

  <!-- ── Home / Auth ── -->
  <rect x="360" y="55" width="180" height="50" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="450" y="75" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">Home · Login · Signup</text>
  <text x="450" y="93" text-anchor="middle" fill="#64748b" font-size="10">Public Routes (/,/login,/signup)</text>

  <!-- Auth divider -->
  <line x1="450" y1="105" x2="450" y2="130" stroke="#10b981" stroke-width="1.5" marker-end="url(#nb)"/>
  <rect x="335" y="130" width="230" height="30" rx="6" fill="#134e3a" stroke="#10b981" stroke-width="1.3"/>
  <text x="450" y="150" text-anchor="middle" fill="#10b981" font-size="11" font-weight="bold">JWT Auth · ProtectedRoute · AuthContext</text>

  <!-- Fan out lines -->
  <line x1="200" y1="160" x2="200" y2="200" stroke="#475569" stroke-width="1.2" marker-end="url(#na)"/>
  <line x1="380" y1="160" x2="310" y2="200" stroke="#475569" stroke-width="1.2" marker-end="url(#na)"/>
  <line x1="450" y1="160" x2="450" y2="200" stroke="#475569" stroke-width="1.2" marker-end="url(#na)"/>
  <line x1="520" y1="160" x2="590" y2="200" stroke="#475569" stroke-width="1.2" marker-end="url(#na)"/>
  <line x1="700" y1="160" x2="700" y2="200" stroke="#475569" stroke-width="1.2" marker-end="url(#na)"/>

  <!-- horizontal connector -->
  <line x1="200" y1="160" x2="700" y2="160" stroke="#334155" stroke-width="1"/>

  <!-- ══ PATIENT module ═══════════════════════════════════ -->
  <rect x="30" y="200" width="160" height="30" rx="6" fill="#818cf8" opacity="0.9"/>
  <text x="110" y="220" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Patient  /patient/*</text>

  <rect x="30" y="244" width="160" height="220" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.3"/>
  <text x="110" y="264" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="bold">Pages</text>
  <text x="110" y="280" text-anchor="middle" fill="#e2e8f0" font-size="9">Dashboard</text>
  <text x="110" y="295" text-anchor="middle" fill="#e2e8f0" font-size="9">Profile</text>
  <text x="110" y="310" text-anchor="middle" fill="#e2e8f0" font-size="9">Medical Records</text>
  <text x="110" y="325" text-anchor="middle" fill="#e2e8f0" font-size="9">Health Analytics</text>
  <text x="110" y="340" text-anchor="middle" fill="#e2e8f0" font-size="9">Activity Logs</text>
  <text x="110" y="355" text-anchor="middle" fill="#e2e8f0" font-size="9">Smartwatch Insights</text>
  <line x1="50" y1="368" x2="170" y2="368" stroke="#334155" stroke-width="0.8"/>
  <text x="110" y="384" text-anchor="middle" fill="#6366f1" font-size="9" font-weight="bold">Contexts Used</text>
  <text x="110" y="399" text-anchor="middle" fill="#64748b" font-size="9">AuthContext</text>
  <text x="110" y="412" text-anchor="middle" fill="#64748b" font-size="9">AccessibilityContext</text>
  <text x="110" y="427" text-anchor="middle" fill="#64748b" font-size="9">ThemeContext</text>
  <text x="110" y="442" text-anchor="middle" fill="#64748b" font-size="9">axios /api/patient</text>

